<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedWood Rp Police Administration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-deep: #06080f;
            --panel-bg: rgba(13, 17, 26, 0.88);
            --gold-primary: #3b82f6;
            --gold-glow: rgba(59, 130, 246, 0.15);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: rgba(59, 130, 246, 0.2);
            --gold-star: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.015) 1px, transparent 1px),
                radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .admin-container {
            width: 92%; max-width: 1200px; margin: 30px auto;
            display: flex; flex-direction: column; gap: 40px;
        }

        .details-view { display: flex; flex-direction: column; gap: 20px; animation: fadeInUp 0.4s ease forwards; }
        .details-view.fade-out { animation: simpleFadeOut 0.3s ease forwards; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes simpleFadeOut { from { opacity: 1; } to { opacity: 0; } }

        .section-header-bar {
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-left: 3px solid var(--gold-primary);
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .section-header-bar h2 {
            font-size: 20px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px;
        }
        .section-header-bar h2 i { color: var(--gold-primary); text-shadow: 0 0 8px var(--gold-glow); }

.tier-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px; /* هذه الإضافة ستخلق مسافة وفراغاً فخماً بين كل قسم والذي يليه */
}        .tier-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

.officer-card {
    background: var(--panel-bg); 
    backdrop-filter: blur(15px);
    border: 1px solid var(--border-color); 
    border-radius: 8px;
    padding: 30px 20px 35px 20px; /* تم زيادة الحشوة السفلية إلى 35px لإعطاء مساحة مريحة */
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    text-align: center;
    position: relative; 
    overflow: hidden; 
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
}
        .officer-card:hover { border-color: rgba(59, 130, 246, 0.4); transform: translateY(-3px); box-shadow: 0 12px 35px var(--gold-glow); }

        .avatar-container {
            width: 85px; height: 85px; border-radius: 50%; border: 2px solid var(--gold-primary);
            padding: 3px; margin-bottom: 15px; background: rgba(0,0,0,0.5); box-shadow: 0 0 10px var(--gold-glow);
            display: flex; align-items: center; justify-content: center; color: var(--gold-primary); font-size: 32px;
        }
        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .officer-name { font-size: 16px; font-weight: 800; color: #f1f3f7; margin-bottom: 6px; }
        .officer-rank {
            font-size: 12px; font-weight: 700; color: var(--gold-primary); background: rgba(59, 130, 246, 0.08);
            padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border-color); display: inline-block;
        }

        .details-header-flex {
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-left: 3px solid var(--gold-primary);
            padding: 20px 25px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .back-to-dash-btn {
            background: rgba(59, 130, 246, 0.03); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px; text-decoration: none; transition: all 0.3s ease;
        }
        .back-to-dash-btn:hover { background: var(--gold-primary); color: #fff; box-shadow: 0 0 12px var(--gold-glow); }

        .details-header-flex h2 { font-size: 22px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 12px; }
        .details-header-flex h2 i { color: var(--gold-primary); text-shadow: 0 0 8px var(--gold-glow); }

        footer {
            text-align: center; padding: 30px; border-top: 1px solid var(--border-color);
            color: var(--text-muted); font-size: 12px; background: rgba(6, 8, 15, 0.95); margin-top: 40px;
        }
        footer span { color: #fff; font-weight: 700; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div id="sec1" class="details-view">
            <div class="details-header-flex">
                <h2><i class="fa-solid fa-scale-balanced"></i> 4. إدارة الشرطة</h2>
                <a href="index.html" class="back-to-dash-btn" id="backBtn"><i class="fa-solid fa-arrow-right"></i> العودة</a>
            </div>

            <!-- حاوية الضباط الديناميكية المرتبطة بلوحة التحكم -->
            <div id="policeOfficersContainer"></div>

        </div>
    </div>

    <footer>
        <span>جميع الحقوق محفوظة © 2026 RedWood Rp CFW</span> <br>
        <span style="color: var(--text-muted); font-size: 11px; margin-top: 5px; display: inline-block;">تصميم وتطوير النظام بواسطة X.X95</span>
    </footer>

    <script>
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            const viewSection = document.getElementById('sec1');
            viewSection.classList.add('fade-out');
            setTimeout(() => { window.location.href = targetUrl; }, 300);
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadPoliceOfficers();
        });

        function loadPoliceOfficers() {
            const container = document.getElementById('policeOfficersContainer');
            // البيانات الافتراضية أو المسجلة في لوحة التحكم
            let officersData = JSON.parse(localStorage.getItem('policeAdministrationList')) || [
                {
                    tierTitle: "Senior Commanders",
                    officers: [
                        { name: "T-1 ABDULLAH ALOTIBI", rank: "State Trooper Commissioner", img: "ABDULLAH ALOTIBI.png" },
                        { name: "M-0 Sharlot Klyde", rank: "State High Commander", img: "Sharlot Klyde.png" },
                        { name: "T-3 Lucas Hunter", rank: "State High Commander", img: "Lucas Hunter.png" }
                    ]
                },
                {
                    tierTitle: "Chiefs Leadership",
                    officers: [
                        { name: "A-1 Manuel Norbega", rank: "LSPD Chief - Swat Commander", img: "Manuel Norbega.png" },
                        { name: "Nothing", rank: "SASP CHIEF", img: "" }
                    ]
                },
                {
                    tierTitle: "Department Administration",
                    officers: [
                    ]
                }
            ];

            let html = '';
            officersData.forEach(tier => {
                html += `
                    <div class="tier-section">
                        <div class="section-header-bar">
                            <h2><i class="fa-solid fa-shield-halved"></i> ${tier.tierTitle}</h2>
                        </div>
                        <div class="tier-cards-grid">
                `;
                tier.officers.forEach(off => {
                    let avatarHtml = off.img ? `<img src="${off.img}" alt="Officer Avatar">` : `<i class="fa-solid fa-user placeholder-icon"></i>`;
                    html += `
                        <div class="officer-card">
                            <div class="avatar-container">${avatarHtml}</div>
                            <div class="officer-name">${off.name}</div>
                            <div class="officer-rank">${off.rank}</div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
