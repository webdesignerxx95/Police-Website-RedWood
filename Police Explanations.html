<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedWood Rp Police Explanations</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-deep: #06080f;
            --panel-bg: rgba(13, 17, 26, 0.88);
            --gold-primary: #3b82f6; /* تم التغيير إلى اللون الأزرق */
            --gold-glow: rgba(59, 130, 246, 0.15); /* توهج أزرق خفيف */
            --text-main: #f8fafc; /* أبيض ناصع وناعم للنصوص الرئيسية */
            --text-muted: #cbd5e1; /* رمادي مائل للبيض للمساعدات */
            --border-color: rgba(59, 130, 246, 0.2);
            --red-alert: #3b82f6;
            --gold-alert: #60a5fa;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.015) 1px, transparent 1px),
                radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .rules-container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .details-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeInUp 0.4s ease forwards;
        }

        .details-view.fade-out {
            animation: simpleFadeOut 0.3s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes simpleFadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .details-header-flex {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--gold-primary);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .details-header-flex h2 {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .details-header-flex h2 i {
            color: var(--gold-primary);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .back-to-dash-btn {
            background: rgba(59, 130, 246, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-to-dash-btn:hover {
            background: var(--gold-primary);
            color: #fff;
            box-shadow: 0 0 12px var(--gold-glow);
        }

        /* Video Grid / Container */
        .explanations-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        .video-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .video-card:hover { border-color: rgba(59, 130, 246, 0.4); transform: translateY(-3px); }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .video-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .video-title i { color: var(--gold-primary); }
        .video-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 16px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background: transparent !important;
            backdrop-filter: none !important;
            border-top: none !important;
        }

        @media (max-width: 768px) {
            .details-header-flex {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="rules-container">

        <div id="sec1" class="details-view">
            <div class="details-header-flex">
                <h2 data-ar="8. شروحات الشرطة" data-en="8. Police Explanations"><i class="fa-solid fa-star"></i> 8. شروحات الشرطة</h2>
                <a href="index.html" class="back-to-dash-btn" id="backBtn"><i class="fa-solid fa-arrow-right"></i> <span data-ar="العودة" data-en="Back">العودة</span></a>
            </div>
            
            <div id="explanationsContainer" class="explanations-container">
            </div>
        </div>
    </div>

    <footer>
        <div style="direction: rtl; unicode-bidi: embed; color: var(--text-muted); font-size: 12px;">
            <span data-ar="جميع الحقوق محفوظة" data-en="Copyright">جميع الحقوق محفوظة</span> <span dir="ltr" style="display: inline-block;">RedWood Rp CFW 2026 ©</span>
        </div>
        <div style="direction: rtl; unicode-bidi: embed; color: var(--text-muted); font-size: 11px; margin-top: 5px;">
            <span data-ar="تصميم وتطوير النظام بواسطة" data-en="System Architecture & Design by">تصميم وتطوير النظام بواسطة</span> <span dir="ltr" style="display: inline-block;">X.X95</span>
        </div>
    </footer>

    <script>
        let currentLang = 'ar';

        // تفعيل أنيميشن التلاشي عند الضغط على زر العودة
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            const viewSection = document.getElementById('sec1');
            
            viewSection.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        });

        function loadExplanations() {
            const container = document.getElementById('explanationsContainer');
            let explanations = JSON.parse(localStorage.getItem('policeExplanationsList'));

            if (!explanations) {
                explanations = [
                    { title: "قريباً", videoId: "YOUR_VIDEO_ID", desc: "قريباً" }
                ];
                localStorage.setItem('policeExplanationsList', JSON.stringify(explanations));
            }

            container.innerHTML = '';

            if (explanations.length === 0) {
                container.innerHTML = `<div class="empty-msg" data-ar="لا توجد شروحات مضافة حالياً." data-en="No explanations added yet.">لا توجد شروحات مضافة حالياً.</div>`;
                return;
            }

            explanations.forEach(item => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${item.videoId}" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <h3 class="video-title"><i class="fa-brands fa-youtube"></i> <span>${item.title}</span></h3>
                    <p class="video-desc">${item.desc || 'لا يوجد وصف إضافي.'}</p>
                `;
                container.appendChild(card);
            });
        }

        window.onload = function() {
            loadExplanations();
        };
    </script>

</body>
</html>
