<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedWood Rp Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-deep: #060a12;
            --panel-bg: rgba(10, 18, 32, 0.88);
            --panel-border: rgba(255, 255, 255, 0.15);
            --gold-primary: #3182ce;
            --gold-gradient: linear-gradient(135deg, #63b3ed 0%, #3182ce 50%, #1e6091 100%);
            --gold-glow: rgba(49, 130, 206, 0.3);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --success-color: #10b981;
            --danger-color: #f43f5e;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(49, 130, 206, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(49, 130, 206, 0.05) 0%, transparent 45%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #password-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 10, 18, 0.95); backdrop-filter: blur(25px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 9999;
        }

        .pass-box { 
            background: var(--panel-bg); padding: 50px 40px; border-radius: 28px; 
            text-align: center; border: 1px solid var(--panel-border);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85); width: 90%; max-width: 460px;
            position: relative; overflow: hidden;
        }

        .pass-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--gold-gradient);
        }

        .pass-box-icon {
            width: 70px; height: 70px; margin: 0 auto 20px auto; background: rgba(49, 130, 206, 0.1);
            border: 1px solid var(--panel-border); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--gold-primary); box-shadow: 0 0 20px var(--gold-glow);
        }

        .pass-box h3 { margin-bottom: 8px; font-size: 24px; font-weight: 800; color: #fff; }
        .pass-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }
        
        #dashboard-content { display: none; flex: 1; flex-direction: column; justify-content: space-between; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 8%; background: var(--panel-bg); backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--panel-border); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 21px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--gold-primary); }
        
        .nav-home-btn { 
            background: rgba(49, 130, 206, 0.08); color: var(--text-main); padding: 11px 22px; 
            border-radius: 12px; text-decoration: none; font-size: 13px; border: 1px solid var(--panel-border);
            display: flex; align-items: center; gap: 9px; font-weight: 700;
        }

        .container { padding: 50px 20px; max-width: 1100px; margin: auto; width: 100%; }
        .page-title { color: #fff; margin-bottom: 40px; font-size: 32px; text-align: center; font-weight: 900; }

        .dashboard-tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            color: var(--text-muted); padding: 15px 25px; border-radius: 16px;
            cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px;
        }
        .tab-btn.active {
            background: var(--gold-gradient); color: #fff; border-color: transparent;
            box-shadow: 0 12px 30px var(--gold-glow);
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .control-card {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            padding: 40px; border-radius: 24px; margin-bottom: 35px; position: relative; overflow: hidden;
        }
        .control-card h3 { 
            font-size: 21px; margin-bottom: 30px; color: #fff; display: flex; align-items: center; gap: 14px; 
            border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 20px; font-weight: 800;
        }
        .control-card h3 i { color: var(--gold-primary); font-size: 24px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .form-group { margin-bottom: 25px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 10px; color: var(--text-muted); font-weight: 700; }
        
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 16px 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--panel-border);
            border-radius: 14px; color: #fff; outline: none; font-size: 15px;
        }
        .form-group textarea { resize: vertical; min-height: 100px; }

        .btn-action {
            background: var(--gold-gradient); color: #fff; border: none; padding: 16px 30px;
            border-radius: 14px; cursor: pointer; font-weight: 800; width: 100%; font-size: 16px; 
            display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 25px rgba(49, 130, 206, 0.25);
        }

        .rules-manage-list { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .rule-edit-item {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--panel-border); padding: 25px;
            border-radius: 20px; display: flex; flex-direction: column; gap: 16px;
        }
        
        .btn-delete { 
            background: rgba(244, 63, 94, 0.12); color: var(--danger-color); border: 1px solid rgba(244, 63, 94, 0.3); 
            padding: 12px 22px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; 
        }
        .btn-save-single { 
            background: rgba(16, 185, 129, 0.12); color: var(--success-color); border: 1px solid rgba(16, 185, 129, 0.3); 
            padding: 12px 22px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; 
        }

        .toast {
            position: fixed; bottom: 40px; right: 40px; background: rgba(16, 185, 129, 0.95);
            color: white; padding: 18px 32px; border-radius: 16px; font-weight: 700;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); display: none; z-index: 10000; backdrop-filter: blur(20px);
        }

        footer { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--panel-border); background: rgba(6, 10, 18, 0.95); }
    </style>
</head>
<body>

    <div id="password-overlay">
        <div class="pass-box">
            <div class="pass-box-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h3>تحقق مشرفي RedWood RP</h3>
            <p>قم بتسجيل الدخول باستخدام حسابك في ديسكورد للتحقق من رتبة الإدارة:</p>
            <a href="https://discord.com/api/oauth2/authorize?client_id=1564836241416003635&redirect_uri=https%3A%2F%2Fredwood-discord-auth.onrender.com%2Fapi%2Fauth%2Fdiscord%2Fcallback&response_type=code&scope=identify%20guilds.members.read" class="btn-action" style="text-decoration: none;">
                <i class="fa-brands fa-discord"></i> تسجيل الدخول عبر Discord
            </a>
        </div>
    </div>

    <div id="dashboard-content">
        <header>
            <div class="logo"><i class="fa-solid fa-gauge-high"></i> RedWood <span>RP | Master Control</span></div>
            <a href="index.html" class="nav-home-btn"><i class="fa-solid fa-house"></i> العودة للموقع</a>
        </header>

        <div class="container">
            <h1 class="page-title">لوحة التحكم في محتوى الموقع</h1>
            
            <div class="dashboard-tabs">
                <button class="tab-btn active" onclick="switchTab('police-admin-tab', this)"><i class="fa-solid fa-user-shield"></i> إدارة قيادات الشرطة</button>
            </div>

            <!-- Tab: Police Administration Management -->
            <div id="police-admin-tab" class="tab-pane active">
                <div class="control-card">
                    <h3><i class="fa-solid fa-user-plus"></i> إضافة ضابط / قيادي جديد</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اختر القسم أو المجموعة:</label>
                            <select id="newOfficerTier">
                                <option value="Senior Commanders">Senior Commanders (القيادة العليا)</option>
                                <option value="Chiefs Leadership">Chiefs Leadership (قادة القطاعات)</option>
                                <option value="Department Administration">Department Administration (الإدارة)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>اسم الضابط:</label>
                            <input type="text" id="newOfficerName" placeholder="مثال: T-1 ABDULLAH">
                        </div>
                        <div class="form-group">
                            <label>الرتبة / المنصب:</label>
                            <input type="text" id="newOfficerRank" placeholder="مثال: Commissioner">
                        </div>
                        <div class="form-group">
                            <label>رابط الصورة أو اسم الملف:</label>
                            <input type="text" id="newOfficerImg" placeholder="مثال: image.png أو رابط مباشر">
                        </div>
                    </div>
                    <button class="btn-action" onclick="addNewOfficer()"><i class="fa-solid fa-circle-plus"></i> إضافة الضابط للقائمة ونشره</button>
                </div>
                <div class="control-card">
                    <h3><i class="fa-solid fa-list-check"></i> إدارة الضباط الحاليين</h3>
                    <div id="adminPoliceOfficersContainer" class="rules-manage-list"></div>
                </div>
            </div>
        </div>

        <footer>
            <p>جميع الحقوق محفوظة © 2026 RedWood RP</p>
        </footer>
    </div>

    <div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> تم حفظ التغييرات بنجاح!</div>

<script>
    const RENDER_SERVER_URL = "https://redwood-discord-auth.onrender.com";

    let cloudData = {
        policeAdministrationList: [
            { tierTitle: "Senior Commanders", officers: [] },
            { tierTitle: "Chiefs Leadership", officers: [] },
            { tierTitle: "Department Administration", officers: [] }
        ]
    };

    async function loadDataFromServer() {
        try {
            const res = await fetch(`${RENDER_SERVER_URL}/api/site-data`);
            const serverData = await res.json();
            if (serverData.policeAdministrationList && serverData.policeAdministrationList.length > 0) {
                cloudData.policeAdministrationList = serverData.policeAdministrationList;
            }
        } catch (e) {
            console.log("Error loading from server, checking local storage.");
            let local = localStorage.getItem('policeAdministrationList');
            if (local) cloudData.policeAdministrationList = JSON.parse(local);
        }
        loadAdminPoliceOfficers();
    }

    async function saveToCloudServer(dataType, dataContent, actionDesc) {
        const userIdInput = sessionStorage.getItem('discord_user_id') || "MasterAdmin";
        cloudData[dataType] = dataContent;
        localStorage.setItem(dataType, JSON.stringify(dataContent));

        showToast('جاري إرسال البيانات إلى السيرفر...');

        try {
            const response = await fetch(`${RENDER_SERVER_URL}/api/update-site-data`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userIdInput, dataType: dataType, dataContent: dataContent })
            });

            if(response.ok) {
                showToast('تم حفظ ونشر التغييرات للجميع بنجاح! 🚀');
            } else {
                showToast('حدث خطأ في استجابة السيرفر.');
            }
        } catch (e) {
            console.error("Cloud sync error:", e);
            showToast('خطأ: تعذر الاتصال بالسيرفر. تحقق من الشبكة.');
        }
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('auth') === 'true') {
            sessionStorage.setItem('authMaster', 'true');
            sessionStorage.setItem('discord_user_id', urlParams.get('userId'));
        }

        if(sessionStorage.getItem('authMaster') === 'true') {
            document.getElementById('password-overlay').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'flex';
        }
        loadDataFromServer();
    }
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    function loadAdminPoliceOfficers() {
        const officersData = cloudData.policeAdministrationList || [];
        const container = document.getElementById('adminPoliceOfficersContainer');
        if (!container) return;
        container.innerHTML = '';

        let hasOfficers = false;
        officersData.forEach((tier, tierIndex) => {
            if(tier.officers) {
                tier.officers.forEach((off, offIndex) => {
                    hasOfficers = true;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'rule-edit-item';
                    itemDiv.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <label style="color: var(--gold-primary); font-weight: bold;">[${tier.tierTitle}]</label>
                            <select id="off-tier-${tierIndex}-${offIndex}" style="padding:6px; background:#000; color:#fff; border-radius:8px;">
                                <option value="Senior Commanders" ${tier.tierTitle === 'Senior Commanders' ? 'selected' : ''}>Senior Commanders</option>
                                <option value="Chiefs Leadership" ${tier.tierTitle === 'Chiefs Leadership' ? 'selected' : ''}>Chiefs Leadership</option>
                                <option value="Department Administration" ${tier.tierTitle === 'Department Administration' ? 'selected' : ''}>Department Administration</option>
                            </select>
                        </div>
                        <input type="text" id="off-name-${tierIndex}-${offIndex}" value="${off.name}" placeholder="اسم الضابط">
                        <input type="text" id="off-rank-${tierIndex}-${offIndex}" value="${off.rank}" placeholder="الرتبة">
                        <input type="text" id="off-img-${tierIndex}-${offIndex}" value="${off.img || ''}" placeholder="الصورة">
                        <div style="display:flex; gap:10px;">
                            <button class="btn-save-single" onclick="updateOfficer(${tierIndex}, ${offIndex})"><i class="fa-solid fa-check"></i> حفظ</button>
                            <button class="btn-delete" onclick="deleteOfficer(${tierIndex}, ${offIndex})"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    `;
                    container.appendChild(itemDiv);
                });
            }
        });

        if (!hasOfficers) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">لا يوجد ضباط حالياً. أضف ضابطاً من النموذج بالأعلى.</p>';
        }
    }

    function addNewOfficer() {
        const targetTierTitle = document.getElementById('newOfficerTier').value;
        const name = document.getElementById('newOfficerName').value.trim();
        const rank = document.getElementById('newOfficerRank').value.trim();
        const img = document.getElementById('newOfficerImg').value.trim();
        
        if(!name || !rank) { alert('الرجاء إدخال اسم الضابط ورتبته!'); return; }
        
        let officersData = cloudData.policeAdministrationList;
        let targetTier = officersData.find(t => t.tierTitle === targetTierTitle);
        if (targetTier) {
            targetTier.officers.push({ name, rank, img });
        }

        document.getElementById('newOfficerName').value = '';
        document.getElementById('newOfficerRank').value = '';
        document.getElementById('newOfficerImg').value = '';
        
        saveToCloudServer('policeAdministrationList', officersData, "تم إضافة ضابط جديد");
        loadAdminPoliceOfficers();
    }

    function updateOfficer(tierIndex, offIndex) {
        const newTierTitle = document.getElementById(`off-tier-${tierIndex}-${offIndex}`).value;
        const name = document.getElementById(`off-name-${tierIndex}-${offIndex}`).value.trim();
        const rank = document.getElementById(`off-rank-${tierIndex}-${offIndex}`).value.trim();
        const img = document.getElementById(`off-img-${tierIndex}-${offIndex}`).value.trim();
        
        let officersData = cloudData.policeAdministrationList;
        let officerObj = officersData[tierIndex].officers.splice(offIndex, 1)[0];
        
        officerObj.name = name;
        officerObj.rank = rank;
        officerObj.img = img;

        let targetTier = officersData.find(t => t.tierTitle === newTierTitle);
        if (targetTier) {
            targetTier.officers.push(officerObj);
        }
        
        saveToCloudServer('policeAdministrationList', officersData, "تم تعديل الضابط");
        loadAdminPoliceOfficers();
    }

    function deleteOfficer(tierIndex, offIndex) {
        if(!confirm('هل أنت متأكد من حذف هذا الضابط؟')) return;
        let officersData = cloudData.policeAdministrationList;
        officersData[tierIndex].officers.splice(offIndex, 1);
        
        saveToCloudServer('policeAdministrationList', officersData, "تم حذف الضابط");
        loadAdminPoliceOfficers();
    }
</script>
</body>
</html>
